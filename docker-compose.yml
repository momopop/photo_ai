services:
  # Python AI 服务
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: photoai-ai-service
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
      - ai_uploads:/app/uploads
      - ai_models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node.js 后端 API 网关
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: photoai-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - AI_SERVICE_URL=http://ai-service:8000
      - PORT=3000
    depends_on:
      ai-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ai_uploads:
  ai_models:
  backend_uploads:
